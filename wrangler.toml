name = "auralink"
main = "src/index.js"
compatibility_date = "2024-03-01"

[build]
command = "npm run build:frontend"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "auralink"
database_id = "ad3c6a71-a781-4df9-80f0-8fa43313804c"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "auralink"
preview_bucket_name = "auralink"
